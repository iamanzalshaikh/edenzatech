<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="grad-fitsync" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(350, 80%, 15%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(390, 80%, 5%);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow-fitsync" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(350, 90%, 60%);stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:hsl(390, 90%, 40%);stop-opacity:0" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad-fitsync)" />
  
  <!-- Ambient Glow -->
  <circle cx="400" cy="300" r="200" fill="url(#glow-fitsync)" filter="url(#blur)" />

  <!-- Phone Frame Silhouette -->
  <g transform="translate(260, 80)">
    <!-- Outer phone body -->
    <rect width="280" height="580" rx="40" fill="#09090b" stroke="hsl(350, 40%, 30%)" stroke-width="4" />
    
    <!-- Inner Screen -->
    <rect x="10" y="10" width="260" height="560" rx="32" fill="#18181b" />
    
    <!-- Notch -->
    <rect x="90" y="15" width="100" height="25" rx="12" fill="#000" />
    
    <!-- UI Elements Abstract -->
    <circle cx="140" cy="180" r="40" fill="hsl(350, 80%, 50%)" opacity="0.8" />
    <rect x="40" y="260" width="200" height="20" rx="10" fill="#3f3f46" />
    <rect x="40" y="300" width="160" height="15" rx="7.5" fill="#27272a" />
    <rect x="40" y="330" width="140" height="15" rx="7.5" fill="#27272a" />
    
    <rect x="40" y="380" width="200" height="60" rx="16" fill="hsl(350, 60%, 20%)" stroke="hsl(350, 60%, 40%)" stroke-width="2" />
    
    <!-- Title -->
    <text x="140" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">FitSync Tracker</text>
  </g>
</svg>